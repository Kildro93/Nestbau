<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Nestbau Rezept-Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="logo">N</span>
    <h1>Rezept zu Nestbau</h1>
  </header>

  <main>
    <div class="page">
      <div class="title" id="pageTitle">Seite wird gelesen...</div>
      <div class="host" id="pageHost"></div>
      <span class="tag" id="pageTag" hidden></span>
    </div>

    <button id="saveBtn" disabled>Rezept speichern</button>
    <button class="ghost" id="connectBtn" hidden>Mit Nestbau verbinden</button>

    <div class="msg" id="msg"></div>
  </main>

  <footer>
    <span id="deviceLabel"></span>
    <a href="#" id="optionsLink">Einstellungen</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
